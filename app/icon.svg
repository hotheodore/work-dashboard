<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2b2926"/>
      <stop offset="1" stop-color="#171614"/>
    </linearGradient>
    <linearGradient id="mark" x1="5" y1="8" x2="27" y2="27" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".5" stop-color="#a8d8f5"/>
      <stop offset="1" stop-color="#4f8fd0"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7.5" fill="url(#plate)"/>

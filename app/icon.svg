    <rect x="20.7" y="10.9" width="2.9" height="8.1" rx="1.45" opacity=".8"/>
    <rect x="5" y="19" width="22" height="2.8" rx="1.4"/>
    <rect x="7.4" y="21.8" width="2.9" height="4.8" rx="1.45" opacity=".62"/>
    <rect x="21.7" y="21.8" width="2.9" height="4.8" rx="1.45" opacity=".62"/>
  </g>
</svg>
